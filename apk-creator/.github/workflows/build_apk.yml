name: GitHub Actions Cloud APK Builder

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode or Extract Project Zip
        run: |
          if [ -f "workspace/project.zip" ]; then
            echo "Found workspace/project.zip in checkout!"
            unzip -o workspace/project.zip
          else
            echo "Downloading workspace/project.zip from GitHub..."
            curl -s -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/workspace/project.zip" -o raw_project.zip || true
            if [ -s "raw_project.zip" ]; then
              unzip -o raw_project.zip
            elif [ -n "${{ github.event.client_payload.projectZipBase64 }}" ]; then
              echo "Decoding projectZipBase64 fallback..."
              echo "${{ github.event.client_payload.projectZipBase64 }}" | base64 -d > project.zip
              unzip -o project.zip
            fi
          fi
          chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
