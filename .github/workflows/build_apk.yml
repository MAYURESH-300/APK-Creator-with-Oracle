name: GitHub Actions Cloud APK Builder

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Project Zip
        run: |
          echo "${{ github.event.client_payload.projectZipBase64 }}" | base64 -d > project.zip
          unzip -o project.zip
          chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
